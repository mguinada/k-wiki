# Quality gates for pipeline development.
#
# Runs the gates (typecheck, lint, test) plus the end-to-end job
# (e2e + health) on every pull request and on every push to main.
# The pull_request run tests the PR's merge commit, so it catches
# incompatibilities with main before merge; the push run catches a
# merge that landed despite a red PR check — without it, a merge
# like #171 (unit tests red on its own final checks) leaves main
# broken with nothing to say so (#146 review, 2026-08-27). Push runs
# are cheap: they test the merged commit the PR run already
# validated, so they only differ when the PR was merged red. The test job runs with
# coverage and fails below the 90% thresholds in vitest.config.ts; the
# report prints file paths and percentages only. The repo is private and
# runs on GitHub-hosted runners: no step may print raw/ or vault contents
# into logs — the gates emit tool diagnostics only, and the test suite
# reads synthetic fixtures, never real vault data.
#
# The gates job audits dependencies before typecheck (issue #292): a
# high-or-worse advisory in the production tree, or a critical
# advisory anywhere (dev toolchain included), blocks the job; a
# high anywhere is advisory — logged by a continue-on-error step
# whose findings also surface as ::warning annotations on the run
# page, never blocking, because dev-tree transitive advisories are
# frequently wait-for-upstream. The fix loop for those is Dependabot
# alerts + automated security updates (repo settings) plus the
# github-actions ecosystem in dependabot.yml — npm version updates
# are deliberately excluded there. `npm run audit` is the local
# on-demand form of the two blocking audits; it stays out of the
# agent quality-gate loop by design (network-bound, advisory-
# database-dependent — see issue #292's Rationale).
#
# The e2e job is blocking like the gates: `npm run e2e` drives the real
# sync and wiki-ingest CLIs as child processes — against the synthetic
# fixture vault and a stub agent in temp workspaces — and `npm run
# health` validates the committed raw/ snapshot (trivially healthy
# today; guards future synced content). Both are deterministic and
# fast — unlike mutation testing.
#
# The mutation jobs are advisory, never a gate (issue #21):
# continue-on-error keeps their outcome from blocking merge. Three
# shapes now (issue #261):
# - PR runs: only when a PR carries the `mutation` label — one
#   diff-scoped job vs origin/main, like the optional local run
#   (issue #99); the checkout needs full history (fetch-depth: 0).
# - Nightly (03:30 UTC): the mutation-nightly job is window-scoped —
#   it mutates only the src/ hunks changed in the trailing 7 days
#   ($MUTATION_WINDOW_DAYS; src/quality/mutation-scope.ts resolves the
#   base SHA, oldest-commit fallback). A quiet window (nothing
#   changed) files a synthetic empty report so the ledger stays
#   confirmed current. The nightly carries the advisory complexity
#   debt report (issue #178): npm run complexity:full prints the
#   whole-src/ per-function debt table and uploads it as an artifact
#   (7-day retention); the table is advisory, though the run also
#   re-executes the changed-mode gate (a clean nightly checkout has
#   nothing changed, so it passes).
# - Manual dispatch: the chunked code-wide FULL run (issue #236) —
#   the exceptional audit / ledger-rewrite path, nothing schedules
#   it. The full run outgrew GitHub's 6 h per-job limit (8619
#   mutants, cancelled at 5 h 58 m before any report existed), so
#   src/quality/mutation-chunk.ts splits the mutate list into
#   size-balanced disjoint chunks, one parallel job each;
#   mutation-merge then stitches the chunk reports into the one
#   mutation.json the mutation-report artifact and the mutants-report
#   workflow consume. The merge refuses a partial picture (--expect
#   the chunk count): a cancelled or failed chunk fails the merge
#   loudly, preserving the issue #208 starvation signal — while
#   fail-fast: false keeps one bad chunk from cancelling its
#   siblings, so the merge can name exactly what is missing.
# Every mutation job follows the same log-hygiene rule: Stryker
# mutates and prints repo code under src/ only; the suite reads
# synthetic fixtures, never vault data.
#
# The full dispatched run starts with a dry run of the whole unit
# suite in Stryker's vitest worker-thread pool; any failing test kills
# the run before a report exists (issue #215: a suite red on main —
# #171, merged over its own red checks — and a chdir-incompatible
# test — #193 — each starved the rolling survivor issue #208 for a
# night). continue-on-error keeps that failure non-blocking, so the
# annotation steps in the mutation jobs mark the run page with an
# error while the job stays advisory-green.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly at 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Split by event name (issue #261): a 03:30 nightly must not cancel
  # an owner's hours-long dispatched full run mid-flight (nor a push
  # cancel the nightly), so schedule, dispatch, push, and pull_request
  # each get their own group. cancel-in-progress stays on — it exists
  # for superseded PR runs on the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action || 'push' }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    # `labeled` events exist only to evaluate the mutation job's label
    # condition; the gates skip them.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies at critical (blocking)
        run: npm audit --audit-level=critical
      - name: Audit all dependencies at high (advisory)
        # Log-only: dev-tree advisories at high are wait-for-upstream
        # as often as not; the annotations step below surfaces them on
        # the run page. Never blocks.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Annotate advisory audit findings
        # Re-runs the audit as JSON and emits one ::warning annotation
        # per finding, so dev-tree advisories are visible on the check
        # run and run page, not buried in the log above. Never blocks.
        continue-on-error: true
        run: >
          npm audit --audit-level=high --json | jq -r
          '.vulnerabilities // {} | to_entries[] |
          "::warning title=npm audit - \(.key)::\(.value.severity) severity,
          range \(.value.range); via \([.value.via[]? | if type == "object"
          then .name else . end] | unique | join(", "))"'
      - run: npm run typecheck

  lint:
    name: Lint
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the complexity gate rides this job inside the
          # unit run and diffs the working tree against origin/main,
          # which a shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    name: End-to-end and health
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - run: npm run health

  mutation:
    name: Mutation testing (advisory)
    # PRs: only when labeled `mutation`, diff-scoped (issue #99). The
    # nightly windowed run lives in mutation-nightly below; dispatched
    # FULL runs live in the chunked mutation-chunks + mutation-merge
    # jobs below (issue #236) — never per push.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    # Advisory signal, not a gate: a failing run must never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: mutation:changed diffs the working tree against
          # origin/main, which a shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complexity debt report (advisory)
        if: always()
        run: npm run complexity:full | tee complexity-debt-report.txt
      - name: Upload complexity debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-debt-report
          path: complexity-debt-report.txt
          retention-days: 7
      - name: Mutation testing run
        id: mutation
        run: npm run mutation:changed
      - name: Surface a failed advisory run
        # continue-on-error would otherwise leave the run page fully
        # green (#215); the annotation is visible without gating anything.
        # The mutants-report workflow then fails loudly on the missing
        # artifact (its designed signal, issue #208).
        if: always() && steps.mutation.outcome == 'failure'
        run: >
          echo "::error title=Mutation run failed::The advisory mutation run
          exited nonzero — see this job's log. A failed PR run files
          no report, so the rolling survivor issue (#208) is not updated."
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          # mutation.json rides along so the mutants-report workflow can
          # render the rolling survivor issue from the same run (issue #208).
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          retention-days: 7

  mutation-nightly:
    name: Mutation nightly, windowed (advisory)
    # Nightly at 03:30 UTC: window-scoped (issue #261) — mutates only
    # the src/ hunks changed in the trailing 7 days, never the whole
    # tree. The code-wide chunked run below is manual-dispatch-only
    # (the exceptional audit / ledger-rewrite path).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Advisory signal, not a gate: a failing run must never block
    # anything; the missing artifact is the loud signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the window base resolves a main SHA from N
          # days ago, which a shallow checkout cannot see.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complexity debt report (advisory)
        if: always()
        run: npm run complexity:full | tee complexity-debt-report.txt
      - name: Upload complexity debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-debt-report
          path: complexity-debt-report.txt
          retention-days: 7
      - name: Window-scoped mutation run
        id: mutation
        env:
          MUTATION_WINDOW_DAYS: "7"
        run: npm run mutation:changed
      - name: Quiet window - synthetic empty report
        # Zero src/ changes in the window skips Stryker entirely; a
        # synthetic empty report keeps the filing firing so the ledger
        # is confirmed current. Only on a successful scoped run — a
        # failed run must leave the artifact missing (the designed
        # starvation signal, issue #208).
        if: steps.mutation.outcome == 'success'
        run: |
          if [ ! -f reports/mutation/mutation.json ]; then
            echo "Quiet window: no src/ changes in the trailing window - synthetic empty report."
            mkdir -p reports/mutation
            printf '{"files":{}}' > reports/mutation/mutation.json
          fi
      - name: Surface a failed advisory run
        if: always() && steps.mutation.outcome == 'failure'
        run: >-
          echo "::error title=Mutation nightly failed::The advisory
          windowed mutation run exited nonzero - see this job's log. No
          mutation-report artifact is filed, so the rolling survivor
          issue is not updated."
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          # mutation.json rides along so the mutants-report workflow can
          # merge the rolling survivor issue's ledger from the same run
          # (issue #208); the HTML report is absent on a quiet window.
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          retention-days: 7

  mutation-chunks:
    name: Mutation chunk ${{ matrix.chunk }} of 4 (advisory)
    # Manual dispatch only (issue #261): the code-wide chunked FULL
    # run is the exceptional audit / ledger-rewrite path — no schedule
    # arm remains. Size-balanced disjoint src/ chunks (issue #236) so
    # no single job approaches GitHub's 6 h per-job limit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # One failing chunk must not cancel its siblings: each chunk's
      # artifact must exist (or its absence stay attributable) so the
      # merge can name exactly what is missing.
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    # Advisory signal, not a gate: a failing chunk must never block a
    # merge; the merge job turns a missing chunk into the loud signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the chunk's dry run executes the whole unit
          # suite, and the live complexity-gate test diffs against
          # origin/main — a shallow checkout has no such ref and the
          # dry run dies before any mutant runs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute this chunk's mutate list
        id: globs
        run: >
          echo "globs=$(node dev/mutation-chunk.ts --index
          ${{ matrix.chunk }} --total 4)" >> "$GITHUB_OUTPUT"
      - name: Mutation testing run (chunk ${{ matrix.chunk }} of 4)
        id: mutation
        run: npm run mutation -- --mutate "${{ steps.globs.outputs.globs }}"
      - name: Surface a failed advisory chunk
        if: always() && steps.mutation.outcome == 'failure'
        run: >
          echo "::error title=Mutation chunk ${{ matrix.chunk }} failed::The
          advisory mutation run for chunk ${{ matrix.chunk }} of 4 exited
          nonzero — see this job's log. Its report is missing, so the merge
          below fails and the rolling survivor issue (#208) is not updated."
      - name: Upload chunk mutation report
        # Only a successful chunk reports; a missing artifact is exactly
        # what the merge's --expect 4 turns into the loud failure.
        if: steps.mutation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-chunk-${{ matrix.chunk }}
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          retention-days: 7

  mutation-merge:
    name: Mutation report merge (advisory)
    # Stitches the chunk reports into the one mutation-report artifact
    # the mutants-report workflow consumes (issue #236). Runs whenever
    # the chunk jobs ran (even cancelled/failed ones — always()), but
    # never on PR runs where they were skipped.
    needs: mutation-chunks
    if: always() && needs.mutation-chunks.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: npm run complexity:full re-executes the
          # changed-mode gate, which diffs against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complexity debt report (advisory)
        if: always()
        run: npm run complexity:full | tee complexity-debt-report.txt
      - name: Upload complexity debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-debt-report
          path: complexity-debt-report.txt
          retention-days: 7
      - name: Download chunk mutation reports
        # Zero matches warn but do not fail; the merge's --expect turns
        # the missing inputs into the loud, named failure.
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-report-chunk-*
          path: chunks
      - name: Merge chunk reports
        id: merge
        run: >
          mkdir -p reports/mutation && node dev/mutation-merge.ts
          reports/mutation/mutation.json
          chunks/mutation-report-chunk-*/mutation.json --expect 4
      - name: Surface a failed advisory merge
        if: always() && steps.merge.outcome == 'failure'
        run: >
          echo "::error title=Mutation merge failed::The chunk reports could
          not be merged into one report — a chunk job failed or was
          cancelled (see the chunk jobs' logs and annotations). No
          mutation-report artifact is filed, so the rolling survivor issue
          (#208) is not updated."
      - name: Copy a chunk's HTML bootstrap beside the merged report
        # Stryker's mutation.html loads ./mutation.json at view time, so
        # any chunk's bootstrap renders the MERGED report when copied
        # next to it; the per-chunk artifacts keep the per-chunk views.
        if: steps.merge.outcome == 'success'
        run: >
          cp "$(ls chunks/mutation-report-chunk-*/mutation.html | head -1)"
          reports/mutation/mutation.html
      - name: Upload mutation report
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          retention-days: 7
