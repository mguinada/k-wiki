# Quality gates for pipeline development.
#
# Runs the gates (typecheck, lint, test) plus the end-to-end job
# (e2e + health) on every pull request. The run tests the PR's merge
# commit, so it catches incompatibilities with main before merge. Pushes are not run separately: the pull_request run
# already covers each commit through its PR. The test job runs with
# coverage and fails below the 90% thresholds in vitest.config.ts; the
# report prints file paths and percentages only. The repo is private and
# runs on GitHub-hosted runners: no step may print raw/ or vault contents
# into logs — the gates emit tool diagnostics only, and the test suite
# reads synthetic fixtures, never real vault data.
#
# The e2e job is blocking like the gates: `npm run e2e` drives the real
# sync and wiki-ingest CLIs as child processes — against the synthetic
# fixture vault and a stub agent in temp workspaces — and `npm run
# health` validates the committed raw/ snapshot (trivially healthy
# today; guards future synced content). Both are deterministic and
# fast — unlike mutation testing.
#
# The mutation job is advisory, never a gate (issue #21): it runs only
# when a PR carries the `mutation` label, nightly on main, or via manual
# dispatch, and continue-on-error keeps its outcome from blocking merge.
# It follows the same log-hygiene rule: Stryker mutates and prints repo
# code under src/ only; the suite reads synthetic fixtures, never vault
# data.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly at 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action || 'push' }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    # `labeled` events exist only to evaluate the mutation job's label
    # condition; the gates skip them.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    name: End-to-end and health
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - run: npm run health

  mutation:
    name: Mutation testing (advisory)
    # PRs: only when labeled `mutation`. Otherwise: nightly schedule on
    # main and manual workflow_dispatch runs. Scheduled/dispatched runs
    # carry no pull_request context, so contains() falls through to false
    # without erroring.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    # Advisory signal, not a gate: a failing run must never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          retention-days: 7
