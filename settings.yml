# Agent configuration for wiki-ingest (guide §18, issue #11).
# The wrapper reads these values and passes them to the agent CLI;
# nothing is hardcoded. Top-level `key: value` scalars only.

command: pi        # agent CLI, run non-interactively in the data repo
provider: zai      # passed as --provider; omit to use pi's default
model: GLM-5.2     # passed as --model
reasoning: high    # pi thinking level, passed as --thinking

# Example: how to add another model. Keep exactly one active
# provider/model pair. To switch, comment the two lines above out and
# uncomment a pair below (Kimi via OpenRouter):
# provider: openrouter
# model: moonshotai/kimi-k2.6
