# Agent configuration for wiki-ingest (guide §18, issue #11).
# The wrapper reads these values and passes them to the agent CLI;
# nothing is hardcoded. Top-level `key: value` scalars only, plus
# comma-separated list settings.

# The Runner adapter serving this file (issue #434): the agent CLI's
# flag language (argv/env, isolation, whitelist, web grant,
# credential probe) lives behind it. Default and only adapter today:
# pi. An unknown value is a named settings error.
agent: pi

command: pi        # agent CLI, run non-interactively in the data repo
# Ordered ingest targets: a failed target is retried only before it
# produces a kept output surface. The first target is the primary.
targets: [zai/GLM-5.2, openai-codex/gpt-5.6-terra]
reasoning: high    # pi thinking level, passed as --thinking

# Optional quota gate for scheduled and manual sync:
# auto resolves this machine's quota-axi; off disables all quota checks.
# Or set an absolute path to a compatible quota-axi executable (no arguments,
# shell syntax, or credentials); k-wiki supplies its fixed JSON/no-refresh arguments.
# A failing explicit path warns and proceeds; it never silently selects another binary.
quotaPreflight: auto

# Extra quota runway reserved above the 30-minute cycle estimate for shared-account use. Default: 5m.
# Only whole-minute values are supported; invalid or unsupported units warn and use 5m.
# quotaPreflightBuffer: 5m

# Second-brain instances only (issue #96): comma-separated domain
# wiki dirs — the wiki-sync cycle runs the check-crosslinks audit
# against every listed wiki after lint, before the commit. Leave the
# key out (as here) to skip the stage; the default instance is a
# domain wiki and never audits.
# secondBrain.domains: [~/Lab/k-wiki-engineering-data/wiki]

# Isolate spawned agent runs from global pi configuration (issue
# #118): the wrapper passes --no-context-files --no-extensions
# --no-skills so installed personas, extensions, and skills cannot
# leak into headless ingest/lint runs. Set false only to debug with
# the ambient global setup.
isolate: true

# Whitelist for isolated runs (issue #144): specific skills and
# extensions loaded additively even under the --no-* flags — exactly
# the named entries, nothing ambient. Skill entries are paths
# resolved against this file's directory (~ allowed); extension
# entries are pi -e sources: a path, npm:<package>, or git:<repo>.
# A missing entry warns and is omitted; the run proceeds. Ignored
# with isolate: false. Each extension entry is a deliberate trust
# grant — extensions execute code via hooks.
#
# pi-web-access is deliberately NOT whitelisted: the wiki is a
# closed-world system (wiki/AGENTS.md, Residual Risk) and no prompt
# or contract rule governs web use — granting search/fetch tools
# would let unattended runs send note-derived content to third
# parties and add facts with no origin in raw/. Revisit once a
# usage policy exists (issue #228).
isolate.skills: [.agents/skills/obsidian-markdown, .agents/skills/obsidian-bases]
isolate.extensions: [npm:pi-subagents]

# Legacy single-target form remains supported; comment the targets
# line out first — the two forms cannot be combined:
# provider: openrouter
# model: moonshotai/kimi-k2.6
